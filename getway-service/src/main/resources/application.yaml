server:
  port: 8000

spring:
  application:
    name: getway-service
  config:
    import: "optional:configserver:"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri:
                lb://order-service
              predicates:
                - Path=/api/orders/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/microservices

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

