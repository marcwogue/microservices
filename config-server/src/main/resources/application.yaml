spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/marcwogue/microservices.git
          default-label: ${CONFIG_GIT_LABEL:main}
          search-paths:
            - config-repo
          clone-on-start: true
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
server:
  port: 8888
